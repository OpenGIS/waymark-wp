name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SVN_URL: https://plugins.svn.wordpress.org/waymark
    outputs:
      deployed: ${{ steps.release_check.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gate the deploy on the actual SVN state rather than the local readme.
      # A readme synced to the new version in the same commit would otherwise
      # match Waymark.php and skip a deploy WordPress.org has not received.
      - name: Check whether the release tag exists in SVN
        id: release_check
        run: |
          VERSION=$(grep -m1 'Version:' Waymark.php | awk '{print $NF}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if svn ls "$SVN_URL/tags/$VERSION/" > /dev/null 2>&1; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION already exists in SVN, skipping deploy."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION does not exist in SVN, deploying version $VERSION."
          fi

      - name: Set up Node
        if: steps.release_check.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: steps.release_check.outputs.deploy == 'true'
        run: npm ci

      - name: Sync versions and build artefacts
        if: steps.release_check.outputs.deploy == 'true'
        run: npx grunt sync_version build

      - name: Build distributable zip
        if: steps.release_check.outputs.deploy == 'true'
        env:
          VERSION: ${{ steps.release_check.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/waymark"
          rsync -rc --exclude-from=.distignore ./ "$RUNNER_TEMP/waymark/" --delete --delete-excluded
          cd "$RUNNER_TEMP"
          rm -f "waymark-$VERSION.zip"
          zip -r -X "waymark-$VERSION.zip" waymark

      - name: Deploy to WordPress.org
        if: steps.release_check.outputs.deploy == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WORDPRESS_PASSWORD }}
          SLUG: waymark
          VERSION: ${{ steps.release_check.outputs.version }}

      # Confirm the tag actually landed in SVN before syncing files back or
      # creating the GitHub Release, so a failed tag creation blocks the release.
      - name: Verify deployed tag
        if: steps.release_check.outputs.deploy == 'true'
        env:
          VERSION: ${{ steps.release_check.outputs.version }}
        run: |
          if ! svn ls "$SVN_URL/tags/$VERSION/" > /dev/null 2>&1; then
            echo "::error::Tag $VERSION was not created in SVN."
            exit 1
          fi

      - name: Commit synced release files
        if: steps.release_check.outputs.deploy == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme.txt package.json readme.md languages/ assets/ waymark-js/dist
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync release artefacts for v${{ steps.release_check.outputs.version }}"
            git push
          fi

      - name: Create tag and release
        if: steps.release_check.outputs.deploy == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_check.outputs.version }}
          name: v${{ steps.release_check.outputs.version }}
          target_commitish: master
          files: ${{ runner.temp }}/waymark-${{ steps.release_check.outputs.version }}.zip
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  readme_assets:
    name: Deploy readme and assets to WordPress.org SVN
    needs: deploy
    if: needs.deploy.outputs.deployed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SVN_URL: https://plugins.svn.wordpress.org/waymark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WordPress.org serves the readme from the stable tag directory, so never
      # let trunk advertise a stable tag that does not exist in SVN.
      - name: Verify stable tag exists in SVN
        run: |
          TAG=$(grep -m1 'Stable tag:' readme.txt | awk '{print $NF}')
          if ! svn ls "$SVN_URL/tags/$TAG/" > /dev/null 2>&1; then
            echo "::error::readme.txt Stable tag is $TAG but that tag does not exist in SVN. Bump the version in Waymark.php and push so CI deploys it before publishing the readme."
            exit 1
          fi

      # WordPress.org serves the readme from the stable tag directory, so the
      # action commits the readme and assets to both trunk and that tag.
      - name: Deploy readme and assets to WordPress.org
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WORDPRESS_PASSWORD }}
          SLUG: waymark
          IGNORE_OTHER_FILES: true
