name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_ENV_PHP_VERSION: "8.5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: i18n parity check
        run: npm run i18n:check

      - name: JS tests
        run: npm run test:js

      - name: Start wp-env
        run: npx wp-env start

      - name: Log environment versions
        run: |
          npx wp-env run tests-cli -- php -v
          npx wp-env run tests-cli -- wp core version

      - name: Prepare test container
        run: npm run test:php:setup

      - name: PHP tests
        run: npm run test:php

      # Run the browser suite even if the PHP step fails, so both always report.
      - name: Install Playwright Chromium
        if: always()
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        if: always()
        run: npm run test:e2e

  php-floor:
    name: PHP floor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_ENV_PHP_VERSION: "8.3"
      WP_ENV_CORE: "WordPress/WordPress#6.4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start wp-env
        run: npx wp-env start

      - name: Log environment versions
        run: |
          npx wp-env run tests-cli -- php -v
          npx wp-env run tests-cli -- wp core version

      - name: PHP syntax lint
        run: npm run test:php:lint

      - name: Prepare test container
        run: npm run test:php:setup

      - name: PHP tests
        run: npm run test:php

  video:
    name: Video
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Validate video deliverables
        run: node scripts/video/validate.mjs
